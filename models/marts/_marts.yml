version: 2
models:
  - name: fct_vehicle_sales
    description: Ventes gouvernées. Base unique de toutes les métriques de la semantic layer.
    columns:
      - name: sale_id
        data_tests: [unique, not_null]
      - name: sale_date
        data_tests: [not_null]
      - name: selling_price
        data_tests: [not_null]
      - name: vehicle_model_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_vehicle_model')
                field: vehicle_model_id
      - name: seller_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_seller')
                field: seller_id
      - name: state_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_state')
                field: state_code
      - name: is_below_mmr
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

  - name: dim_vehicle_model
    description: Une ligne par configuration (marque, modèle, finition, carrosserie, année-modèle).
    columns:
      - name: vehicle_model_id
        data_tests: [unique, not_null]

  - name: dim_seller
    description: Une ligne par vendeur, avec un type heuristique.
    columns:
      - name: seller_id
        data_tests: [unique, not_null]
      - name: seller_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['rental', 'finance_lease', 'fleet', 'manufacturer']

  - name: dim_state
    description: Une ligne par code état, avec pays et région.
    columns:
      - name: state_code
        data_tests: [unique, not_null]

  - name: metricflow_time_spine
    description: Une ligne par jour.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
        data_tests: [unique, not_null]
