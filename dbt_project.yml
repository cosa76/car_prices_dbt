name: car_prices
version: "1.0.0"
config-version: 2
profile: car_prices

model-paths: ["models"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Chemin du CSV brut, relatif au dossier du projet dbt
  raw_csv_path: "../car_prices.csv"
  # Règle métier : en dessous de ce prix, la vente est jugée non représentative
  min_selling_price: 500

models:
  car_prices:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table

seeds:
  car_prices:
    make_aliases:
      +column_types:
        raw_make: varchar
        make: varchar
    us_states:
      +column_types:
        state_code: varchar
