name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DBT_PROFILES_DIR: .
  # La CI tourne sur l'échantillon versionné, jamais sur le CSV complet.
  DBT_VARS: "{raw_csv_path: ci/car_prices_sample.csv}"

jobs:
  dbt:
    name: dbt build + MetricFlow
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: dbt parse
        run: dbt parse --vars "$DBT_VARS"

      - name: dbt build (seeds, modèles, tests)
        run: dbt build --vars "$DBT_VARS"

      - name: MetricFlow validate-configs
        run: mf validate-configs

      - name: MetricFlow saved queries (smoke test)
        run: |
          for q in monthly_kpis revenue_by_region_and_seller_type below_mmr_by_body_type; do
            echo "::group::$q"
            mf query --saved-query "$q" --limit 5
            echo "::endgroup::"
          done

      - name: Compiler l'app Streamlit
        run: python -m py_compile app/streamlit_app.py

      - name: Publier les artefacts dbt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target
          path: |
            target/manifest.json
            target/run_results.json
            target/semantic_manifest.json
            logs/
          if-no-files-found: ignore
          retention-days: 7
